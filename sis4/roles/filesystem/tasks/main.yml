- name: Service group
  ansible.builtin.group:
    name: "{{ app_group }}"
    system: true

- name: Service user without login shell
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    system: true
    home: /opt/vikunja
    create_home: false
    shell: /usr/sbin/nologin

- name: Directory layout
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ fs_layout }}"

- name: Application env file
  ansible.builtin.template:
    src: app.env.j2
    dest: /etc/vikunja/app.env
    owner: root
    group: "{{ app_group }}"
    mode: "0640"

- name: Application log file
  ansible.builtin.file:
    path: /var/log/vikunja/app.log
    state: touch
    owner: "{{ app_user }}"
    group: adm
    mode: "0640"
    modification_time: preserve
    access_time: preserve
